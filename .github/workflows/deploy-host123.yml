name: Deploy to Host123

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-host123:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Preview upload (dry-run)
        env:
          FTP_HOST: ${{ secrets.HOST123_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.HOST123_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOST123_FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.HOST123_FTP_REMOTE_PATH }}
        run: |
          echo "Dry-run: listing what would be uploaded to $FTP_HOST -> $FTP_REMOTE_PATH"
          sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            open ftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_HOST;
            mirror --reverse --only-newer --verbose --dry-run \
              --exclude-glob .git --exclude-glob .github --exclude-glob backend/config.php ./ $FTP_REMOTE_PATH;
          "

      - name: Deploy via FTPS to Host123 (upload changed/new files only)
        env:
          FTP_HOST: ${{ secrets.HOST123_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.HOST123_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOST123_FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.HOST123_FTP_REMOTE_PATH }}
        run: |
          echo "Starting deployment (only changed/new files) to $FTP_HOST -> $FTP_REMOTE_PATH"
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            open ftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_HOST;
            # Upload only files that are newer or missing on remote. Do NOT delete remote files.
            mirror --reverse --only-newer --verbose \
              --exclude-glob .git --exclude-glob .github --exclude-glob backend/config.php ./ $FTP_REMOTE_PATH;
          "
